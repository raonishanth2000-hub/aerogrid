AWSTemplateFormatVersion: '2010-09-09'
Description: 'AeroGrid CI/CD Pipeline - AWS CodePipeline connecting GitHub, CodeBuild, and CodeDeploy'

Parameters:
  GitHubRepository:
    Type: String
    Default: 'vedant/aerogrid'
    Description: 'Full GitHub repository name (Owner/Repo)'
  GitHubBranch:
    Type: String
    Default: 'main'
    Description: 'Target branch to trigger continuous delivery'
  CodeStarConnectionArn:
    Type: String
    Default: 'arn:aws:codestar-connections:ap-south-1:123456789012:connection/example-connection-id'
    Description: 'AWS CodeStar Connection ARN connecting AWS to GitHub'
  EnvironmentName:
    Type: String
    Default: 'production'
    Description: 'Target deployment environment name'

Resources:
  # =========================================================================
  # 1. S3 Artifact Storage with Encryption & Least Privilege
  # =========================================================================
  PipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'aerogrid-cicd-artifacts-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: CleanOldArtifacts
            Status: Enabled
            ExpirationInDays: 30

  # =========================================================================
  # 2. Amazon ECR Repository for AeroGrid Backend Docker Images
  # =========================================================================
  BackendEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: 'aerogrid-backend'
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain only the last 20 backend images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  # =========================================================================
  # 3. IAM Roles (CodeBuild, CodeDeploy, CodePipeline)
  # =========================================================================
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'AeroGrid-CodeBuild-Role-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub '${PipelineArtifactBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: '*'
              - Effect: Allow
                Action:
                  - codebuild:CreateReportGroup
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                  - codebuild:BatchPutCodeCoverages
                Resource: !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/*'

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'AeroGrid-CodePipeline-Role-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelineServicePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - !GetAtt PipelineArtifactBucket.Arn
                  - !Sub '${PipelineArtifactBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref CodeStarConnectionArn
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt BackendCodeBuildProject.Arn
              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - iam:PassRole
                Resource: '*'

  # =========================================================================
  # 4. AWS CodeBuild Project
  # =========================================================================
  BackendCodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: 'AeroGrid-Backend-Build-And-Test'
      Description: 'Compiles backend, runs pytest suite, generates coverage, and builds Docker container'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: 'aws/codebuild/amazonlinux2-x86_64-standard:5.0'
        PrivilegedMode: true  # Required for Docker daemon inside CodeBuild
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref 'AWS::AccountId'
          - Name: IMAGE_REPO_NAME
            Value: !Ref BackendEcrRepository
          - Name: AWS_DEFAULT_REGION
            Value: !Ref 'AWS::Region'
      Source:
        Type: CODEPIPELINE
        BuildSpec: 'buildspec.yml'
      TimeoutInMinutes: 20

  # =========================================================================
  # 5. AWS CodeDeploy Application & Deployment Configuration
  # =========================================================================
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: 'AeroGrid-Backend-Application'
      ComputePlatform: 'ECS'

  # =========================================================================
  # 6. AWS CodePipeline
  # =========================================================================
  AeroGridPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: 'AeroGrid-Backend-Continuous-Delivery'
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket
      Stages:
        # Stage 1: Source from GitHub
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref CodeStarConnectionArn
                FullRepositoryId: !Ref GitHubRepository
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: 'CODE_ZIP'
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        # Stage 2: CodeBuild (Automate backend testing pipeline & container build)
        - Name: TestAndBuild
          Actions:
            - Name: RunBackendTestsAndPackage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref BackendCodeBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

        # Stage 3: Zero-Downtime Blue/Green Deployment with CodeDeploy
        - Name: Deploy
          Actions:
            - Name: BlueGreenDeployToEcs
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: 'AeroGrid-ECS-Production-Group'
                TaskDefinitionTemplateArtifact: BuildArtifact
                AppSpecTemplateArtifact: BuildArtifact
                Image1ContainerName: 'IMAGE1_NAME'
                TaskDefinitionTemplatePath: 'taskdef.json'
                AppSpecTemplatePath: 'appspec.yaml'
              InputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

Outputs:
  PipelineUrl:
    Description: 'AWS Console URL for CodePipeline'
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${AeroGridPipeline}/view?region=${AWS::Region}'
  EcrRepositoryUri:
    Description: 'Amazon ECR Repository URI'
    Value: !GetAtt BackendEcrRepository.RepositoryUri
  ArtifactBucketName:
    Description: 'S3 Artifact Storage Bucket'
    Value: !Ref PipelineArtifactBucket
