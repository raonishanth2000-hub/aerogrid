services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aerogrid-backend
    ports:
      - "8000:8000"
    environment:
      # Default city when a request has no ?city= (see GET /api/cities).
      - AEROGRID_CITY=delhi
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DATA_MODE: api
        VITE_API_BASE_URL: http://localhost:8000
    container_name: aerogrid-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
